<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Warm studio wood background gradient -->
    <linearGradient id="woodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E3D24" />
      <stop offset="45%" stop-color="#7B5333" />
      <stop offset="100%" stop-color="#4A2F1B" />
    </linearGradient>

    <linearGradient id="darkWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24150B" />
      <stop offset="100%" stop-color="#3D2616" />
    </linearGradient>

    <!-- Burlap sack gradient -->
    <linearGradient id="burlapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC9A6" />
      <stop offset="50%" stop-color="#C4A77D" />
      <stop offset="100%" stop-color="#9A7B52" />
    </linearGradient>

    <linearGradient id="burlapShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7BE98" />
      <stop offset="65%" stop-color="#B8986E" />
      <stop offset="100%" stop-color="#876942" />
    </linearGradient>

    <!-- Woven burlap pattern -->
    <pattern id="burlapWeave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 4 L 8 4 M 4 0 L 4 8" stroke="#7A5C38" stroke-width="0.9" stroke-opacity="0.28" />
    </pattern>

    <!-- Green bamboo culm gradient -->
    <linearGradient id="culmGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6F7D44" />
      <stop offset="45%" stop-color="#52602E" />
      <stop offset="100%" stop-color="#353F1C" />
    </linearGradient>

    <!-- Natural bamboo stick gradient -->
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3DFB9" />
      <stop offset="55%" stop-color="#DFC496" />
      <stop offset="100%" stop-color="#B89762" />
    </linearGradient>

    <!-- Kraft tag gradient -->
    <linearGradient id="kraftTag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C8A2" />
      <stop offset="100%" stop-color="#C7A97E" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1A0E06" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Upper dark wood wall -->
  <rect width="1200" height="220" fill="url(#darkWall)" />

  <!-- Wooden tabletop -->
  <rect y="180" width="1200" height="720" fill="url(#woodBg)" />

  <!-- Wood plank seam lines -->
  <line x1="0" y1="340" x2="1200" y2="330" stroke="#2B190D" stroke-width="3.5" opacity="0.65" />
  <line x1="0" y1="560" x2="1200" y2="545" stroke="#2B190D" stroke-width="4" opacity="0.7" />
  <line x1="0" y1="775" x2="1200" y2="758" stroke="#2B190D" stroke-width="4.5" opacity="0.75" />

  <!-- Background green bamboo culms on upper right -->
  <g transform="rotate(24 850 210)" filter="url(#softShadow)">
    <rect x="520" y="130" width="760" height="68" rx="8" fill="url(#culmGreen)" />
    <line x1="690" y1="128" x2="690" y2="200" stroke="#968356" stroke-width="9" />
    <line x1="940" y1="128" x2="940" y2="200" stroke="#968356" stroke-width="9" />
    <rect x="560" y="205" width="720" height="62" rx="8" fill="#8C7448" />
    <line x1="780" y1="204" x2="780" y2="268" stroke="#5A4729" stroke-width="8" />
  </g>

  <!-- Stacked folded burlap sacks in upper left -->
  <g filter="url(#softShadow)">
    <path d="M -20 40 L 285 15 L 320 95 L -20 135 Z" fill="url(#burlapGrad)" />
    <path d="M -20 40 L 285 15 L 320 95 L -20 135 Z" fill="url(#burlapWeave)" />
    <path d="M -20 110 L 315 80 L 330 145 L -20 190 Z" fill="url(#burlapShadow)" />
    <path d="M -20 110 L 315 80 L 330 145 L -20 190 Z" fill="url(#burlapWeave)" />
  </g>

  <!-- BACK BURLAP SACK (30KG per bag) -->
  <g filter="url(#softShadow)">
    <path
      d="M 255 185 Q 410 75 565 65 L 985 305 Q 920 365 785 435 L 625 535 Q 485 480 255 185 Z"
      fill="url(#burlapGrad)"
      stroke="#8D6E46"
      stroke-width="2"
    />
    <path
      d="M 255 185 Q 410 75 565 65 L 985 305 Q 920 365 785 435 L 625 535 Q 485 480 255 185 Z"
      fill="url(#burlapWeave)"
    />
    <!-- Stencil Text on Back Sack -->
    <g transform="translate(515, 165) rotate(-25)">
      <text x="0" y="0" fill="#2B2118" font-family="sans-serif" font-size="33" font-weight="700" letter-spacing="0.5">
        TBStar Company
      </text>
      <text x="15" y="65" fill="#2B2118" font-family="sans-serif" font-size="44" font-weight="800" letter-spacing="0.5">
        Bamboo Sticks
      </text>
      <text x="25" y="118" fill="#2B2118" font-family="sans-serif" font-size="26" font-weight="700">
        Packages: 30KG per bag
      </text>
    </g>
  </g>

  <!-- FRONT OPEN BURLAP SACK WITH BUNDLED STICKS INSIDE -->
  <g filter="url(#softShadow)">
    <!-- Sack Body -->
    <path
      d="M -30 330 Q 115 190 215 170 L 620 435 Q 640 560 545 645 L 335 745 Q 195 725 -30 530 Z"
      fill="url(#burlapShadow)"
      stroke="#7E603B"
      stroke-width="2.5"
    />
    <path
      d="M -30 330 Q 115 190 215 170 L 620 435 Q 640 560 545 645 L 335 745 Q 195 725 -30 530 Z"
      fill="url(#burlapWeave)"
    />

    <!-- Open Sack Mouth Cavity -->
    <ellipse cx="425" cy="590" rx="185" ry="125" transform="rotate(-28 425 590)" fill="#3A2412" stroke="#9E7E53" stroke-width="8" />

    <!-- Dense Bamboo Sticks Protruding from Open Sack -->
    <g transform="rotate(-26 425 585)">
      <rect x="280" y="490" width="290" height="190" rx="75" fill="url(#stickGrad)" />
      <!-- Stick longitudinal lines -->
      <line x1="290" y1="510" x2="565" y2="510" stroke="#9B7A49" stroke-width="2.5" />
      <line x1="285" y1="524" x2="570" y2="524" stroke="#9B7A49" stroke-width="2.5" />
      <line x1="282" y1="538" x2="570" y2="538" stroke="#9B7A49" stroke-width="2.5" />
      <line x1="280" y1="552" x2="570" y2="552" stroke="#9B7A49" stroke-width="2.5" />
      <line x1="280" y1="566" x2="570" y2="566" stroke="#9B7A49" stroke-width="2.5" />
      <line x1="280" y1="580" x2="570" y2="580" stroke="#9B7A49" stroke-width="2.5" />
      <line x1="280" y1="594" x2="570" y2="594" stroke="#9B7A49" stroke-width="2.5" />
      <line x1="280" y1="608" x2="570" y2="608" stroke="#9B7A49" stroke-width="2.5" />
      <line x1="282" y1="622" x2="568" y2="622" stroke="#9B7A49" stroke-width="2.5" />
      <line x1="286" y1="636" x2="565" y2="636" stroke="#9B7A49" stroke-width="2.5" />
      <line x1="292" y1="650" x2="560" y2="650" stroke="#9B7A49" stroke-width="2.5" />
      <line x1="300" y1="664" x2="552" y2="664" stroke="#9B7A49" stroke-width="2.5" />
    </g>

    <!-- Dense Ends of Sticks in Sack Opening -->
    <g fill="#D7B884" stroke="#7A592E" stroke-width="1.5">
      <circle cx="325" cy="605" r="7" /><circle cx="340" cy="598" r="7" /><circle cx="355" cy="590" r="7" />
      <circle cx="370" cy="582" r="7" /><circle cx="385" cy="575" r="7" /><circle cx="400" cy="568" r="7" />
      <circle cx="415" cy="560" r="7" /><circle cx="430" cy="552" r="7" /><circle cx="445" cy="544" r="7" />
      <circle cx="315" cy="622" r="7" /><circle cx="330" cy="615" r="7" /><circle cx="345" cy="608" r="7" />
      <circle cx="360" cy="600" r="7" /><circle cx="375" cy="592" r="7" /><circle cx="390" cy="585" r="7" />
      <circle cx="405" cy="578" r="7" /><circle cx="420" cy="570" r="7" /><circle cx="435" cy="562" r="7" />
      <circle cx="450" cy="554" r="7" /><circle cx="465" cy="546" r="7" /><circle cx="480" cy="538" r="7" />
      <circle cx="305" cy="640" r="7" /><circle cx="320" cy="633" r="7" /><circle cx="335" cy="625" r="7" />
      <circle cx="350" cy="618" r="7" /><circle cx="365" cy="610" r="7" /><circle cx="380" cy="602" r="7" />
      <circle cx="395" cy="595" r="7" /><circle cx="410" cy="588" r="7" /><circle cx="425" cy="580" r="7" />
      <circle cx="440" cy="572" r="7" /><circle cx="455" cy="564" r="7" /><circle cx="470" cy="556" r="7" />
      <circle cx="485" cy="548" r="7" /><circle cx="500" cy="540" r="7" />
      <circle cx="315" cy="656" r="7" /><circle cx="330" cy="648" r="7" /><circle cx="345" cy="640" r="7" />
      <circle cx="360" cy="632" r="7" /><circle cx="375" cy="624" r="7" /><circle cx="390" cy="616" r="7" />
      <circle cx="405" cy="608" r="7" /><circle cx="420" cy="600" r="7" /><circle cx="435" cy="592" r="7" />
      <circle cx="450" cy="584" r="7" /><circle cx="465" cy="576" r="7" /><circle cx="480" cy="568" r="7" />
      <circle cx="495" cy="560" r="7" /><circle cx="510" cy="552" r="7" />
      <circle cx="335" cy="672" r="7" /><circle cx="350" cy="664" r="7" /><circle cx="365" cy="656" r="7" />
      <circle cx="380" cy="648" r="7" /><circle cx="395" cy="640" r="7" /><circle cx="410" cy="632" r="7" />
      <circle cx="425" cy="624" r="7" /><circle cx="440" cy="616" r="7" /><circle cx="455" cy="608" r="7" />
      <circle cx="470" cy="600" r="7" /><circle cx="485" cy="592" r="7" /><circle cx="500" cy="584" r="7" />
      <circle cx="355" cy="686" r="7" /><circle cx="370" cy="678" r="7" /><circle cx="385" cy="670" r="7" />
      <circle cx="400" cy="662" r="7" /><circle cx="415" cy="654" r="7" /><circle cx="430" cy="646" r="7" />
      <circle cx="445" cy="638" r="7" /><circle cx="460" cy="630" r="7" /><circle cx="475" cy="622" r="7" />
    </g>

    <!-- Stencil Text on Front Sack -->
    <g transform="translate(80, 305) rotate(-28)">
      <text x="0" y="0" fill="#2B2118" font-family="sans-serif" font-size="35" font-weight="700">
        TBStar Company
      </text>
      <text x="10" y="64" fill="#2B2118" font-family="sans-serif" font-size="46" font-weight="800">
        Bamboo Sticks
      </text>
      <text x="35" y="128" fill="#2B2118" font-family="sans-serif" font-size="27" font-weight="700">
        Packages: 30KG per bag
      </text>
    </g>
  </g>

  <!-- RIGHT FOREGROUND: TIED CYLINDRICAL BUNDLE OF BAMBOO STICKS -->
  <g filter="url(#softShadow)">
    <g transform="translate(620, 565) rotate(-25)">
      <!-- Cylindrical bundle body -->
      <rect x="0" y="0" width="490" height="165" rx="18" fill="url(#stickGrad)" stroke="#9B7A49" stroke-width="2" />
      <!-- Individual stick lines across bundle -->
      <line x1="6" y1="14" x2="484" y2="14" stroke="#9B7A49" stroke-width="2" />
      <line x1="6" y1="28" x2="484" y2="28" stroke="#9B7A49" stroke-width="2" />
      <line x1="6" y1="42" x2="484" y2="42" stroke="#9B7A49" stroke-width="2" />
      <line x1="6" y1="56" x2="484" y2="56" stroke="#9B7A49" stroke-width="2" />
      <line x1="6" y1="70" x2="484" y2="70" stroke="#9B7A49" stroke-width="2" />
      <line x1="6" y1="84" x2="484" y2="84" stroke="#9B7A49" stroke-width="2" />
      <line x1="6" y1="98" x2="484" y2="98" stroke="#9B7A49" stroke-width="2" />
      <line x1="6" y1="112" x2="484" y2="112" stroke="#9B7A49" stroke-width="2" />
      <line x1="6" y1="126" x2="484" y2="126" stroke="#9B7A49" stroke-width="2" />
      <line x1="6" y1="140" x2="484" y2="140" stroke="#9B7A49" stroke-width="2" />
      <line x1="6" y1="154" x2="484" y2="154" stroke="#9B7A49" stroke-width="2" />

      <!-- Jute twine wrapping around center of bundle -->
      <rect x="225" y="-4" width="28" height="173" rx="6" fill="#8C673E" stroke="#5A3E20" stroke-width="2" />
      <line x1="232" y1="-4" x2="232" y2="169" stroke="#C59E6D" stroke-width="2" />
      <line x1="240" y1="-4" x2="240" y2="169" stroke="#C59E6D" stroke-width="2" />
      <line x1="247" y1="-4" x2="247" y2="169" stroke="#C59E6D" stroke-width="2" />
    </g>

    <!-- Front circular end-face of bundle -->
    <ellipse cx="660" cy="638" rx="54" ry="84" transform="rotate(-22 660 638)" fill="#C9A874" stroke="#7A592E" stroke-width="3" />
    <g fill="#E6CA9A" stroke="#7A592E" stroke-width="1.2">
      <circle cx="645" cy="590" r="6" /><circle cx="660" cy="585" r="6" /><circle cx="675" cy="592" r="6" />
      <circle cx="635" cy="606" r="6" /><circle cx="650" cy="602" r="6" /><circle cx="665" cy="600" r="6" /><circle cx="680" cy="606" r="6" />
      <circle cx="630" cy="622" r="6" /><circle cx="645" cy="618" r="6" /><circle cx="660" cy="616" r="6" /><circle cx="675" cy="618" r="6" /><circle cx="690" cy="624" r="6" />
      <circle cx="632" cy="638" r="6" /><circle cx="647" cy="634" r="6" /><circle cx="662" cy="632" r="6" /><circle cx="677" cy="634" r="6" /><circle cx="692" cy="640" r="6" />
      <circle cx="636" cy="654" r="6" /><circle cx="651" cy="650" r="6" /><circle cx="666" cy="648" r="6" /><circle cx="681" cy="650" r="6" /><circle cx="695" cy="656" r="6" />
      <circle cx="642" cy="670" r="6" /><circle cx="657" cy="666" r="6" /><circle cx="672" cy="664" r="6" /><circle cx="687" cy="668" r="6" />
      <circle cx="652" cy="686" r="6" /><circle cx="667" cy="682" r="6" /><circle cx="682" cy="684" r="6" />
      <circle cx="665" cy="698" r="6" /><circle cx="678" cy="698" r="6" />
    </g>

    <!-- KRAFT SPECIFICATION TAG ATTACHED TO BUNDLE -->
    <g transform="translate(915, 505) rotate(16)">
      <polygon
        points="0,25 32,0 245,0 245,148 32,148 0,123"
        fill="url(#kraftTag)"
        stroke="#8B6C47"
        stroke-width="2"
      />
      <circle cx="22" cy="74" r="7" fill="#4A2F1B" stroke="#755634" stroke-width="2" />
      <path d="M -55 30 Q -15 55 22 74" fill="none" stroke="#8C673E" stroke-width="4" />

      <text x="44" y="28" fill="#23170E" font-family="sans-serif" font-size="19" font-weight="800">
        TBStar Company
      </text>
      <text x="44" y="48" fill="#23170E" font-family="sans-serif" font-size="13.5" font-weight="600">
        Product: Bamboo Sticks
      </text>
      <text x="44" y="66" fill="#23170E" font-family="sans-serif" font-size="13.5" font-weight="600">
        Material: 100% natural bamboo
      </text>
      <text x="44" y="84" fill="#23170E" font-family="sans-serif" font-size="13.5" font-weight="600">
        Thickness: 1.2mm to 2.5mm
      </text>
      <text x="44" y="102" fill="#23170E" font-family="sans-serif" font-size="13" font-weight="600">
        Sizes: 8 inches, 9 inches, 10 inches
      </text>
      <text x="44" y="120" fill="#23170E" font-family="sans-serif" font-size="13.5" font-weight="600">
        Packages: 30KG per bag
      </text>
      <text x="44" y="138" fill="#23170E" font-family="sans-serif" font-size="13.5" font-weight="700">
        Country of Origin: Myanmar
      </text>
    </g>
  </g>

  <!-- Foreground loose bamboo sticks -->
  <g filter="url(#softShadow)">
    <line x1="635" y1="795" x2="1125" y2="650" stroke="#E5C99B" stroke-width="8" stroke-linecap="round" />
    <line x1="660" y1="808" x2="1130" y2="668" stroke="#D9BA87" stroke-width="8" stroke-linecap="round" />
    <line x1="695" y1="835" x2="1115" y2="640" stroke="#EBD2A7" stroke-width="8" stroke-linecap="round" />
    <line x1="705" y1="858" x2="1095" y2="672" stroke="#DFC291" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
