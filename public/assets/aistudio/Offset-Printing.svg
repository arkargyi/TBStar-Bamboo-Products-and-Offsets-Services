<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <!-- Warm sunlit workshop & wood table gradients -->
    <linearGradient id="wallSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7B384" />
      <stop offset="45%" stop-color="#8A6949" />
      <stop offset="100%" stop-color="#4A3623" />
    </linearGradient>

    <linearGradient id="tableWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A5E3B" />
      <stop offset="50%" stop-color="#6B4528" />
      <stop offset="100%" stop-color="#3E2513" />
    </linearGradient>

    <!-- Industrial offset guillotine press machine -->
    <linearGradient id="pressMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E7864" />
      <stop offset="60%" stop-color="#4E5746" />
      <stop offset="100%" stop-color="#31382B" />
    </linearGradient>

    <!-- Kraft tag gradient -->
    <linearGradient id="kraftCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7CCA5" />
      <stop offset="100%" stop-color="#C8A679" />
    </linearGradient>

    <!-- Book cover gradient -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9C78B" />
      <stop offset="50%" stop-color="#3B7A7A" />
      <stop offset="100%" stop-color="#173D2A" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1A0E06" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background studio wall & sunlit window glow -->
  <rect width="1280" height="360" fill="url(#wallSun)" />
  <polygon points="0,0 240,0 160,240 0,290" fill="#FFF3D6" opacity="0.45" />

  <!-- Industrial Paper Guillotine / Offset Press Machine in Upper Right -->
  <g filter="url(#dropShadow)" transform="translate(650, 25)">
    <rect x="60" y="15" width="350" height="190" rx="12" fill="url(#pressMetal)" stroke="#2A3024" stroke-width="3" />
    <rect x="175" y="42" width="110" height="36" rx="4" fill="#3B4234" stroke="#9BA490" stroke-width="2" />
    <text x="190" y="65" fill="#D5DEC8" font-family="monospace" font-size="13" font-weight="700">
      TBStar Press
    </text>
    <!-- Perforated cutter guard -->
    <rect x="105" y="96" width="260" height="34" rx="4" fill="#8C9681" />
    <circle cx="130" cy="113" r="6" fill="#2A3024" />
    <circle cx="160" cy="113" r="6" fill="#2A3024" />
    <circle cx="190" cy="113" r="6" fill="#2A3024" />
    <circle cx="220" cy="113" r="6" fill="#2A3024" />
    <circle cx="250" cy="113" r="6" fill="#2A3024" />
    <circle cx="280" cy="113" r="6" fill="#2A3024" />
    <circle cx="310" cy="113" r="6" fill="#2A3024" />
    <circle cx="340" cy="113" r="6" fill="#2A3024" />
    <!-- White paper stack on press bed -->
    <polygon points="115,155 340,145 385,185 145,198" fill="#F8F9FA" stroke="#CBD5E1" stroke-width="2" />
    <!-- Press bed table -->
    <polygon points="20,175 430,155 470,225 45,250" fill="#464F3F" stroke="#262C22" stroke-width="3" />
  </g>

  <!-- Stacked paper reams on background bench -->
  <g filter="url(#dropShadow)">
    <rect x="425" y="155" width="175" height="65" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" />
    <rect x="45" y="210" width="210" height="85" rx="4" fill="#DFC39D" stroke="#9C7A52" stroke-width="2" />
    <rect x="285" y="195" width="135" height="70" rx="4" fill="#DFC39D" stroke="#9C7A52" stroke-width="2" />
  </g>

  <!-- Main Foreground Wooden Tabletop -->
  <polygon points="0,330 1280,260 1280,800 0,800" fill="url(#tableWood)" />
  <line x1="0" y1="490" x2="1280" y2="420" stroke="#2D1A0C" stroke-width="3" opacity="0.65" />
  <line x1="0" y1="670" x2="1280" y2="595" stroke="#2D1A0C" stroke-width="3.5" opacity="0.7" />

  <!-- 1. HIGH QUALITY PAPERBACK BOOK (Left) -->
  <g filter="url(#dropShadow)" transform="translate(185, 340) rotate(-14)">
    <!-- Book page thickness block -->
    <polygon points="0,155 245,205 255,180 10,130" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Book front cover -->
    <polygon points="0,130 245,180 345,35 110,-10" fill="url(#bookCover)" stroke="#F8FAFC" stroke-width="2" />
    <!-- Dark spine -->
    <polygon points="-8,135 0,130 110,-10 102,-5" fill="#1E293B" />
    <text x="115" y="25" fill="#173D2A" font-family="sans-serif" font-size="16" font-weight="800" transform="rotate(11 115 25)">
      TBStar Company
    </text>
    <text x="75" y="135" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700" transform="rotate(11 75 135)">
      High Quality
    </text>
    <text x="65" y="152" fill="#A8D977" font-family="sans-serif" font-size="15" font-weight="700" transform="rotate(11 65 152)">
      Paperback Book
    </text>
  </g>

  <!-- 2. COMMERCIAL VOUCHER BOOK (Center) -->
  <g filter="url(#dropShadow)" transform="translate(475, 435) rotate(12)">
    <!-- Thick white paper pad base -->
    <rect x="0" y="8" width="295" height="118" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Top voucher sheet -->
    <rect x="0" y="0" width="295" height="106" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Charcoal binding strip on left -->
    <rect x="0" y="0" width="22" height="118" rx="2" fill="#334155" />
    <text x="36" y="24" fill="#1E293B" font-family="sans-serif" font-size="13" font-weight="800">
      TBStar Company
    </text>
    <text x="202" y="30" fill="#0F172A" font-family="sans-serif" font-size="16" font-weight="800" letter-spacing="1">
      VOUCHER
    </text>
    <!-- Voucher table grid lines -->
    <rect x="36" y="40" width="240" height="52" fill="none" stroke="#64748B" stroke-width="1.2" />
    <line x1="36" y1="54" x2="276" y2="54" stroke="#64748B" stroke-width="1.2" />
    <line x1="36" y1="68" x2="276" y2="68" stroke="#CBD5E1" stroke-width="1" />
    <line x1="36" y1="80" x2="276" y2="80" stroke="#CBD5E1" stroke-width="1" />
    <line x1="95" y1="40" x2="95" y2="92" stroke="#64748B" stroke-width="1" />
    <line x1="185" y1="40" x2="185" y2="92" stroke="#64748B" stroke-width="1" />
    <line x1="230" y1="40" x2="230" y2="92" stroke="#64748B" stroke-width="1" />
  </g>

  <!-- 3. CORPORATE PAMPHLETS & BROCHURES (Right & Foreground) -->
  <g filter="url(#dropShadow)" transform="translate(780, 365) rotate(10)">
    <rect x="0" y="8" width="310" height="145" rx="3" fill="#CBD5E1" />
    <rect x="0" y="0" width="310" height="136" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 0 0 L 165 0 Q 140 68 185 136 L 0 136 Z" fill="#0E5A8A" />
    <text x="22" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="800">
      CORPORATE
    </text>
    <text x="22" y="50" fill="#7DD3FC" font-family="sans-serif" font-size="13" font-weight="700">
      PAMPHLET
    </text>
    <rect x="24" y="66" width="34" height="34" fill="#FFFFFF" rx="2" />
    <rect x="195" y="26" width="92" height="45" rx="4" fill="#E0F2FE" />
    <line x1="195" y1="86" x2="285" y2="86" stroke="#64748B" stroke-width="3" />
    <line x1="195" y1="98" x2="275" y2="98" stroke="#94A3B8" stroke-width="3" />
    <line x1="195" y1="110" x2="265" y2="110" stroke="#94A3B8" stroke-width="3" />
  </g>

  <!-- Colorful Brochures & Flyers in Bottom Center -->
  <g filter="url(#dropShadow)" transform="translate(310, 535) rotate(14)">
    <!-- Brochure 1 -->
    <rect x="0" y="0" width="245" height="165" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="125" y="0" width="120" height="165" rx="2" fill="#047857" />
    <rect x="125" y="0" width="120" height="44" fill="#F59E0B" />
    <text x="142" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="800">
      BROCHURE
    </text>
    <text x="18" y="28" fill="#EA580C" font-family="sans-serif" font-size="13" font-weight="800">
      Offset Printing
    </text>
    <line x1="18" y1="45" x2="105" y2="45" stroke="#94A3B8" stroke-width="3" />
    <line x1="18" y1="57" x2="105" y2="57" stroke="#94A3B8" stroke-width="3" />
    <line x1="18" y1="69" x2="95" y2="69" stroke="#94A3B8" stroke-width="3" />
    <rect x="18" y="90" width="90" height="52" rx="3" fill="#E0F2FE" />

    <!-- Corporate Pamphlet 2 -->
    <rect x="255" y="-10" width="215" height="175" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="255" y="-10" width="115" height="75" fill="#0369A1" />
    <text x="268" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="800">
      Corporate
    </text>
    <text x="268" y="44" fill="#BAE6FD" font-family="sans-serif" font-size="14" font-weight="700">
      Pamphlets
    </text>
    <line x1="268" y1="90" x2="365" y2="90" stroke="#64748B" stroke-width="3" />
    <line x1="268" y1="104" x2="365" y2="104" stroke="#94A3B8" stroke-width="3" />
    <line x1="268" y1="118" x2="355" y2="118" stroke="#94A3B8" stroke-width="3" />
  </g>

  <!-- 4. KRAFT TAG IN BOTTOM RIGHT WITH BURMESE & ENGLISH TEXT -->
  <g filter="url(#dropShadow)" transform="translate(855, 510) rotate(13)">
    <polygon
      points="0,0 265,0 305,42 305,175 265,205 0,205"
      fill="url(#kraftCard)"
      stroke="#8C6B43"
      stroke-width="2.5"
    />
    <!-- Metal eyelet hole on right -->
    <circle cx="272" cy="104" r="11" fill="#4A2F1B" stroke="#8C6D46" stroke-width="4" />
    <path d="M 278 104 Q 340 115 395 90" fill="none" stroke="#C59E6D" stroke-width="4" />

    <text x="135" y="40" text-anchor="middle" fill="#1F140B" font-family="sans-serif" font-size="23" font-weight="800">
      TBStar Company
    </text>
    <text x="135" y="68" text-anchor="middle" fill="#1F140B" font-family="sans-serif" font-size="20" font-weight="700">
      Offset Printing
    </text>
    <text x="135" y="98" text-anchor="middle" fill="#1F140B" font-family="Noto Sans Myanmar, sans-serif" font-size="19" font-weight="700">
      ပုံနှိပ်နဲ့ ပတ်သက်တာတွေ
    </text>
    <text x="135" y="126" text-anchor="middle" fill="#1F140B" font-family="Noto Sans Myanmar, sans-serif" font-size="19" font-weight="700">
      One Stop Service ပေးပါတယ်။
    </text>
    <text x="135" y="160" text-anchor="middle" fill="#1F140B" font-family="sans-serif" font-size="18" font-weight="700">
      Books, Voucher Books,
    </text>
    <text x="135" y="186" text-anchor="middle" fill="#1F140B" font-family="Noto Sans Myanmar, sans-serif" font-size="18" font-weight="700">
      Other offset printing များ
    </text>
  </g>
</svg>
